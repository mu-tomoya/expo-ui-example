name: EAS Update Preview

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update:
    name: Publish preview update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🏗 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚀 Publish preview update
        run: >-
          eas update
          --channel preview
          --environment preview
          --message "main ${GITHUB_SHA}"
          --non-interactive
